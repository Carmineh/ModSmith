name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Scanner tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  lint:
    name: Skill lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frontmatter (YAML), referenced files, manifests, UTF-8, scripts parse
        run: |
          npm install --no-save --no-package-lock yaml@2.6.1
          node tools/lint-skill.mjs
