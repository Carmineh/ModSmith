name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: npm test
      - name: Lint and check the tag matches the plugin version
        run: node tools/lint-skill.mjs --tag=${{ github.ref_name }}
      - name: Release notes from CHANGELOG.md
        run: node tools/release-notes.mjs ${{ github.ref_name }} > notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --title "Modsmith ${{ github.ref_name }}" --notes-file notes.md
